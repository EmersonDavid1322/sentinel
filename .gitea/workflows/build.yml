name: Compilar Sentinel

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -S .

      - name: Compilar
        run: cmake --build build

      - name: Confirmar que el binario existe
        run: |
          if [ -f build/sentinel ]; then
            echo "Compilación exitosa, binario generado"
          else
            echo "No se encontró el binario esperado"
            exit 1
          fi
