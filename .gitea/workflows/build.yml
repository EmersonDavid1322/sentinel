name: Compilar Sentinel
on:
  push:
    branches: ["*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar rama no compatible
        if: github.ref_name != 'main'
        run: echo "La rama ${{ github.ref_name }} no es compatible con el despliegue. Cancelando el flujo..."

      - name: Cancelar ejecución CI
        if: github.ref_name != 'main'
        uses: andymckay/cancel-action@0.3

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -S .

      - name: Compilar
        run: cmake --build build



      - name: Subir binario
        uses: actions/upload-artifact@v3
        with:
          name: sentinel-binario
          path: build/sentinel

  # --- DESPLIEGUE EN EL SERVIDOR ---
  deploy-servidor:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Bajar binario
        uses: actions/download-artifact@v3
        with:
          name: sentinel-binario
          path: build

      - name: Comprobar
        run: ls -R build


  # --- DESPLIEGUE EN EL ESCRITORIO ---
  deploy-escritorio:
    needs: deploy-servidor
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Bajar binario
        uses: actions/download-artifact@v3
        with:
          name: sentinel-binario
          path: build

      - name: Comprobar
        run: ls -R build